name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, fz ${{ matrix.fz }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        fz: ["1.2", "main"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install fz
      run: |
        if [ "${{ matrix.fz }}" = "main" ]; then
          pip install git+https://github.com/Funz/fz.git pytest
        else
          pip install "funz-fz==${{ matrix.fz }}" pytest
        fi

    - name: Validate JSON files and shell scripts
      run: |
        for f in .fz/models/*.json .fz/calculators/*.json; do python -m json.tool "$f" > /dev/null; done
        for f in .fz/calculators/*.sh tests/*.sh tests/mock/*; do
          bash -n "$f"
          [ -x "$f" ] || { echo "Error: $f is not executable"; exit 1; }
        done

    - name: Unit tests (model, parsing)
      run: python -m pytest -v tests/

    - name: End-to-end test (mock Serpent)
      run: bash tests/test.sh
